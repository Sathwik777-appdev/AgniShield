services:
  - type: web
    name: agnishield
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agnishield-db
          property: connectionString
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: agnishield-db
    plan: free
    databaseName: agnishield_db
    user: agnishield_user
