name: AgniShield CI & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript & Vite Build
        run: npm run build

  backend-tests:
    name: Backend Test Suite & Health Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Verify Python Syntax
        run: python -m py_compile backend/*.py

      - name: Run Pytest Test Suite
        run: python -m pytest backend/tests/test_api.py -v

  extension-package:
    name: Chrome Extension Package & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Manifest JSON
        run: python -m json.tool extension/manifest.json > /dev/null

      - name: Validate JavaScript Syntax
        run: |
          node --check extension/background/background.js
          node --check extension/content/content.js
          node --check extension/popup/popup.js

      - name: Package Extension
        run: |
          mkdir -p dist
          (cd extension && zip -r ../dist/agnishield-extension.zip .)
          test -f dist/agnishield-extension.zip
